<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#17191D" />
    <!-- 아이폰 등에서 홈 화면에 추가해 PWA로 실행할 때 상단 상태 표시줄(와이파이/배터리 영역)이
         투명하게 처리되어 아래 배경색이 그대로 비쳐 보이도록 한다. theme-color는 자바스크립트에서
         라이트/다크 전환 시마다 동적으로 갱신한다(App.jsx 참고). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 파비콘 -->
    <link rel="icon" type="image/x-icon" href="/1.ico" />
    <link rel="apple-touch-icon" href="/1.ico" />
    <title>Vaulty</title>
    <style>
      /* 웹사이트 내 모든 스크롤바를 시각적으로 숨김(스크롤 동작 자체는 유지) */
      * {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      /* 새로운 디자인(그리드) 뷰에서 두 블록이 인접해 "결합"될 때 이음새를 따라 한 번 반짝이는
         합금(alloy) 용접 이펙트 애니메이션 */
      @keyframes alloyFuse {
        0% {
          opacity: 0;
          transform: scaleY(0.2);
        }
        35% {
          opacity: 1;
          transform: scaleY(1);
        }
        100% {
          opacity: 0;
          transform: scaleY(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
